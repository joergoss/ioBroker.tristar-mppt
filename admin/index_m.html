<html>

<head>
	<!-- Load ioBroker scripts and styles-->
	<link rel="stylesheet" type="text/css" href="../../css/adapter.css" />
	<link rel="stylesheet" type="text/css" href="../../lib/css/materialize.css">

	<script type="text/javascript" src="../../lib/js/jquery-3.2.1.min.js"></script>
	<script type="text/javascript" src="../../socket.io/socket.io.js"></script>
	<script type="text/javascript" src="../../js/translate.js"></script>
	<script type="text/javascript" src="../../lib/js/materialize.js"></script>
	<script type="text/javascript" src="../../js/adapter-settings.js"></script>

	<link rel="stylesheet" type="text/css" href="style.css" />
	<script type="text/javascript" src="words.js"></script>

	<script type="text/javascript">
		function load(settings, onChange) {
			if (!settings) return;
			$('.value').each(function () {
				var $key = $(this);
				var id = $key.attr('id');
				$key.val(settings[id])
					.on('change', () => onChange())
					.on('keyup', () => onChange());
			});
			onChange(false);
			if (M) M.updateTextFields();
		}

		function save(callback) {
			var obj = {};
			$('.value').each(function () {
				var $this = $(this);
				if ($this.attr('type') === 'number') {
					obj[$this.attr('id')] = parseFloat($this.val());
				} else {
					obj[$this.attr('id')] = $this.val();
				}
			});
			callback(obj);
		}
	</script>
</head>

<body>
	<div class="m adapter-container">
		<div class="row">
			<div class="col s12 m4 l2">
				<img src="tristar-mppt.png" class="logo">
			</div>
		</div>

		<div class="row">
			<div class="col s12 m6 input-field">
				<input type="text" class="value" id="hostname" required />
				<label for="hostname" class="translate">Hostname</label>
			</div>
			<div class="col s6 m3 input-field">
				<input type="number" class="value" id="port" min="1" max="65535" step="1" required />
				<label for="port" class="translate">Port</label>
			</div>
			<div class="col s6 m3 input-field">
				<input type="number" class="value" id="unitId" min="1" max="247" step="1" required />
				<label for="unitId" class="translate">Unit ID</label>
			</div>
		</div>

		<div class="row">
			<div class="col s12 m6 input-field">
				<input type="number" class="value" id="interval" min="1" step="1" required />
				<label for="interval" class="translate">Polling interval in seconds</label>
			</div>
			<div class="col s12 m6 input-field">
				<input type="number" class="value" id="installedWP" min="0" step="1" required />
				<label for="installedWP" class="translate">Installed solar power in Wp</label>
				<span class="helper-text translate">Use 0 to disable the power percentage</span>
			</div>
		</div>
	</div>
</body>

</html>
